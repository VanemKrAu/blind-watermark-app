name: flutter_blind_watermark_example
description: "Example app for flutter_blind_watermark plugin."
publish_to: 'none'

version: 1.1.5+8

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_blind_watermark:
    path: ../

  # File picker for selecting images
  file_picker: ^8.0.0

  # Save images directly to gallery (Android/iOS), no share sheet
  gal: ^2.3.0

  # Embed history storage for strong-robust (WAM) code matching
  shared_preferences: ^2.3.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/onnx/wam_embedder.onnx
    - assets/onnx/wam_extractor_int8.onnx








